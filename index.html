<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>DET Mock Test (ElevenLabs)</title>
<style>
:root{--bg:#f4f6fb;--sf:#fff;--tx:#1c2333;--mu:#667085;--br:#d9deea;--ac:#2f6df6;--ok:#12a150;--bad:#d92d20;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--sf:#1a1f2b;--tx:#e8ebf3;--mu:#98a2b3;--br:#2d3445;--ac:#6b9bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131a;--sf:#1a1f2b;--tx:#e8ebf3;--mu:#98a2b3;--br:#2d3445;--ac:#6b9bff;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--sf);border-bottom:1px solid var(--br);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;color:var(--ac)}#pg{flex:1;color:var(--mu);font-size:14px}#tm{font:700 18px ui-monospace,monospace;min-width:52px;text-align:right}
#barw{height:4px;background:var(--br)}#bar{height:4px;background:var(--ac);width:0;transition:width 1s linear}
main{max-width:760px;margin:20px auto;padding:0 14px}
#card{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:22px}
h1,h2{margin:.2em 0 .5em}.tag{display:inline-block;background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.m{color:var(--mu);font-size:14px}.q{font-weight:600}
.b{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer;margin:8px 8px 0 0}.b:disabled{opacity:.5}.g2{background:var(--bad)}

.grid{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.chip{background:transparent;color:var(--tx);border:1px solid var(--br);border-radius:9px;padding:10px 16px;font:inherit;cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
textarea{width:100%;border:1px solid var(--br);border-radius:9px;padding:10px;font:inherit;background:var(--bg);color:var(--tx);margin:8px 0}
.g input{font:inherit;border:0;border-bottom:2px solid var(--ac);background:var(--bg);color:var(--tx);padding:0 2px;margin-left:1px;max-width:110px}
.pass{background:var(--bg);border-radius:10px;padding:12px 14px;margin:10px 0;border-left:4px solid var(--ac)}
.photo{font-size:42px;line-height:1.4;text-align:center;border-radius:12px;padding:14px;margin:10px 0;background:linear-gradient(#bfe0ff,#e9f6e4)}

.big{font-size:64px;font-weight:800;color:var(--ac);line-height:1}.row{display:flex;gap:8px;flex-wrap:wrap}.card2{border:1px solid var(--br);border-radius:10px;padding:12px;margin:10px 0}
li{margin:4px 0}code{background:var(--bg);padding:1px 5px;border-radius:5px}
</style></head><body>
<header><span class="logo">DET&nbsp;Mock</span><span id="pg">Not started</span><span id="tm">--:--</span></header><div id="barw"><div id="bar"></div></div>
<main><div id="card"></div></main>
<script>
const $=s=>document.querySelector(s),C=$('#card');
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a},pick=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let tick,i=-1,res=[],T=0,TTS='speechSynthesis' in window;
function timer(s,fn){clearInterval(tick);let t=s;const u=()=>{$('#tm').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');$('#bar').style.width=(t/s*100)+'%'};u();tick=setInterval(()=>{t--;u();if(t<=0){clearInterval(tick);fn()}},1000)}
let VS=[];const lv_=()=>{VS=speechSynthesis.getVoices().filter(v=>/^en[-_](US|GB)/i.test(v.lang))};if(TTS){lv_();speechSynthesis.onvoiceschanged=lv_}
const best=m=>{const sc=v=>(/Natural|Neural|Online/i.test(v.name)?100:0)+(/Premium|Enhanced|Siri/i.test(v.name)?60:0)+(/Google US English/i.test(v.name)?40:0)+(/en[-_]US/i.test(v.lang)?10:0)+(m?(/Guy|Davis|Christopher|Eric|Daniel|Alex|David|Mark|Tom|Male/i.test(v.name)?30:0):(/Aria|Jenny|Samantha|Ava|Allison|Zira|Susan|Female/i.test(v.name)?30:0));return VS.slice().sort((a,b)=>sc(b)-sc(a))[0]};
const bsay=(t,p=1)=>{if(!TTS)return;const u=new SpeechSynthesisUtterance(t),v=best(p<1);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';u.rate=.9;u.pitch=1;speechSynthesis.speak(u)};
let EL={key:'',f:'',m:''};try{EL.key=localStorage.getItem('elk')||'';EL.f=localStorage.getItem('elf')||'';EL.m=localStorage.getItem('elm')||''}catch(e){}
let CA=null,VO=null;
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('det-audio',1);q.onupgradeneeded=()=>q.result.createObjectStore('a');q.onsuccess=()=>r(q.result);q.onerror=j});
const idg=async k=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction('a').objectStore('a').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}};
const idp=async(k,v)=>{try{const d=await idb();return await new Promise(r=>{const t=d.transaction('a','readwrite');t.objectStore('a').put(v,k);t.oncomplete=()=>r();t.onerror=()=>r()})}catch(e){}};
async function voices(){if(VO)return VO;if(EL.f&&EL.m)return VO={f:EL.f,m:EL.m};const r=await fetch('https://api.elevenlabs.io/v1/voices',{headers:{'xi-api-key':EL.key}});if(!r.ok)throw new Error('voices '+r.status);const all=(await r.json()).voices,lb=v=>v.labels||{},A=all.filter(v=>lb(v).accent=='american'),L=A.length?A:all,f=L.find(v=>lb(v).gender=='female')||L[0],m=L.find(v=>lb(v).gender=='male')||L[0];return VO={f:EL.f||f.voice_id,m:EL.m||m.voice_id}}
async function clip(t,male){const k=(male?'m|':'f|')+t;let b=await idg(k);if(b)return b;const V=await voices();const r=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+(male?V.m:V.f)+'?output_format=mp3_44100_128',{method:'POST',headers:{'xi-api-key':EL.key,'Content-Type':'application/json'},body:JSON.stringify({text:t,model_id:'eleven_multilingual_v2',voice_settings:{stability:.55,similarity_boost:.75,style:0,use_speaker_boost:true,speed:.95}})});if(!r.ok)throw new Error('tts '+r.status);b=await r.blob();await idp(k,b);return b}
const say=(t,p=1)=>{if(!EL.key)return bsay(t,p);if(CA){CA.pause();CA=null}speechSynthesis.cancel();clip(t,p<1).then(b=>{CA=new Audio(URL.createObjectURL(b));CA.play()}).catch(e=>{console.warn(e);bsay(t,p)})};

const nw=s=>s.toLowerCase().replace(/’/g,"'").replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
function lcs(a,b){a=nw(a);b=nw(b);const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]==b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);return a.length?d[a.length][b.length]/a.length:0}
const CON=/\b(because|however|although|therefore|for example|also|but|while|moreover|in addition|on the other hand|as a result|first|finally|so)\b/gi;
const ERR=[[/\bi\b/g,'I'],[/\bdont\b/gi,'don’t'],[/\bcant\b/gi,'can’t'],[/\bim\b/gi,'I’m'],[/\bmore better\b/gi,'better'],[/\bpeoples\b/gi,'people'],[/\binformations\b/gi,'information'],[/\badvices\b/gi,'advice'],[/\bi am agree\b/gi,'I agree'],[/\b(he|she|it) (don't|don’t)\b/gi,'$1 doesn’t'],[/\bthere is many\b/gi,'there are many'],[/\bmuch (people|friends|things)\b/gi,'many $1'],[/\ba ([aeio]\w*)/gi,'an $1'],[/\b(\w+) \1\b/gi,'$1']];
function ws(t,target,sp){const w=t.toLowerCase().match(/[a-z’']+/g)||[],n=w.length;if(!n)return{pts:0,n:0,errs:[],long:0,conn:0};
const long=w.filter(x=>x.length>=7).length,u=new Set(w).size,conn=(t.match(CON)||[]).length,errs=[];
ERR.forEach(([re,f],j)=>{if(sp&&j==0)return;(t.match(re)||[]).forEach(m=>errs.push(`“${m}” → “${m.replace(new RegExp(re.source,re.flags.replace('g','')),f)}”`))});
const len=Math.min(1,n/target),fmt=sp||(/^[A-Z]/.test(t.trim())&&/[.!?]$/.test(t.trim()))?1:0;
let p=.35*len+.2*Math.min(1,long/n/.18)+.15*Math.min(1,u/n/.7)+.15*Math.min(1,conn/Math.max(1,n/35))+.15*fmt-Math.min(.35,errs.length*.07);if(len<.4)p*=.7;
return{pts:Math.max(0,Math.min(1,p)),n,errs,long,conn}}
/* ---------- engines ---------- */
function gaps(c,text,secs,fin){const ws_=[];const html=text.replace(/\{(\w+)\}/g,(m,w)=>{const k=Math.ceil(w.length/2);ws_.push([w,k]);return `<span class="g">${w.slice(0,k)}<input maxlength="${w.length-k}" size="${w.length-k+1}" autocomplete="off" autocapitalize="off" spellcheck="false"></span>`});
c.innerHTML=`<p class="m">Type the missing letters to complete each word.</p><div class="pass" style="line-height:2.2">${html}</div><button class="b" id="ok">Submit</button>`;
const sub=()=>{let ok=0,mist=[];c.querySelectorAll('input').forEach((x,j)=>{const [w,k]=ws_[j],a=w.slice(0,k)+x.value.trim().toLowerCase();if(a==w)ok++;else mist.push(`${a} → ${w}`)});fin({pts:ok/ws_.length,mist})};
$('#ok').onclick=sub;timer(secs,sub)}
function mcq(c,pre,qs,cb){let k=0,ok=0,mist=[],dn=0;const end=()=>{if(dn)return;dn=1;cb(ok,mist,qs.length)};
const show=()=>{if(k>=qs.length)return end();const q=qs[k];c.innerHTML=pre+`<p class="q">${k+1}/${qs.length}. ${q.q}</p>`+sh(q.o).map(x=>`<button class="opt">${x}</button>`).join('');
c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.textContent===q.o[0])ok++;else mist.push(`${q.q.replace(/<[^>]+>/g,'')} — you chose “${b.textContent}”; correct: “${q.o[0]}”`);k++;show()})};show();return end}
function write(c,html,secs,target,cb){c.innerHTML=html+`<textarea id="tx" rows="9" placeholder="Type your answer here…" spellcheck="false"></textarea><div class="m" id="wc">0 words (aim for ${target}+)</div><button class="b" id="ok">Submit</button>`;
$('#tx').oninput=e=>$('#wc').textContent=(e.target.value.match(/\S+/g)||[]).length+` words (aim for ${target}+)`;let d=0;const s=()=>{if(d)return;d=1;cb($('#tx').value)};$('#ok').onclick=s;timer(secs,s)}
function speak(c,o,cb){c.innerHTML=o.html+`<div class="row"><button class="b" id="rb">● ${o.prep?'Start now':'Start recording'}</button><button class="b g2" id="sb" hidden>■ Stop</button></div><div id="ro"></div>`;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let sr,mr,ch=[],txt='',cf=[],t0,done=0,go0=0,stream;
const fin=()=>{if(done)return;done=1;clearInterval(tick);try{sr&&sr.stop()}catch(e){}try{mr&&mr.state!='inactive'&&mr.stop()}catch(e){}stream&&stream.getTracks().forEach(t=>t.stop());const d=(Date.now()-t0)/1000;$('#sb').hidden=true;
setTimeout(()=>{$('#ro').innerHTML=(ch.length?`<audio controls src="${URL.createObjectURL(new Blob(ch,{type:mr.mimeType}))}"></audio>`:'')+`<p class="m">${SR?'Transcript (edit if it is wrong):':'Speech recognition is not available in this browser. Type what you said:'}</p><textarea id="tx" rows="4">${esc(txt)}</textarea><button class="b" id="ok2">Submit</button>`;
$('#ok2').onclick=()=>cb($('#tx').value.trim(),cf.length?cf.reduce((a,b)=>a+b)/cf.length:null,d)},500)};
const go=async()=>{if(go0)return;go0=1;$('#rb').hidden=false;$('#rb').hidden=true;$('#sb').hidden=false;t0=Date.now();timer(o.secs,fin);
try{stream=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(stream);mr.ondataavailable=e=>ch.push(e.data);mr.start()}catch(e){}
if(SR){try{sr=new SR();sr.lang='en-US';sr.continuous=true;sr.onresult=e=>{for(let k=e.resultIndex;k<e.results.length;k++)if(e.results[k].isFinal){txt+=e.results[k][0].transcript+' ';cf.push(e.results[k][0].confidence)}};sr.onend=()=>{if(!done)try{sr.start()}catch(e){}};sr.start()}catch(e){}}};
$('#rb').onclick=go;$('#sb').onclick=fin;if(o.prep)timer(o.prep,go);else{$('#tm').textContent='--:--'}}
/* ---------- content ---------- */
const W={1:[["garden","borrow","ticket","journey","kitchen","window"],["dorbit","strimble","glorent","maffle","flanter","brimble"]],2:[["reluctant","sibling","fragile","negotiate","urban","fluctuate"],["clarvent","dismople","fenstrate","trelling","orbacious","vandelect"]],3:[["ubiquitous","meticulous","ephemeral","ambivalent","scrutinize","pragmatic"],["prelucent","oblivane","intravent","corvalent","sporadine","quendible"]]};
const LT=[["She missed the bus, so she walked to work.","Please turn off your phone before the show starts."],["I’ll meet you outside the library at half past four.","Could you tell me where the nearest pharmacy is?"],["The train to the airport leaves every fifteen minutes from platform two.","My sister has been studying engineering at university for almost three years."],["Although the results were encouraging, the researchers warned that further studies would be necessary.","Despite the heavy rain, thousands of people gathered in the square to celebrate the victory."],["Researchers argue that cities must invest in public transport if they hope to reduce pollution.","The professor suggested that we revise our hypothesis before collecting any further data."],["Had the government acted sooner, the economic consequences of the crisis might have been far less severe.","Critics maintain that the policy, however well intentioned, overlooks the realities faced by small businesses."]];
const FB=["The meeting was {postponed} until next week because the manager was ill.","She {borrowed} a book from the library on her way home.","We were {surprised} by how quickly the weather changed.","He tried to {persuade} his parents to let him study abroad.","The company plans to {expand} its services into new markets.","It is {essential} to drink enough water during a long hike."];
const RC=["Many cities are {experimenting} with ways to reduce {traffic}. In Amsterdam, planners have {created} thousands of bike lanes, and {nearly} half of all trips in the centre are now made on two wheels. Residents say the streets feel {quieter}, and local shops report that customers who {arrive} on foot or by bike tend to visit more often.","Sleep researchers have {discovered} that the brain does not simply {switch} off at night. During deep sleep it {replays} the events of the day, {strengthening} important memories and {discarding} details that seem unimportant. This may explain why a good night’s rest often {improves} performance."];
const PH=["🌤️<br>🏠⛺⛺🏠<br>👩‍🌾🥕🍎🍊🧺👨‍🍳<br>🧒🚲🐕👵🛒","📚🕰️🖼️<br>🪑👩‍💻👨‍🎓👩‍🎓🪑<br>💻📖☕📝🎒"];
const PHn="<p class='m'>Simplified illustration (no external images load in this page). Describe the people, objects, setting and activity.</p>";
const RA=["Public libraries are changing. Besides lending books, many now offer free courses, quiet places to work, and tools that people cannot afford to buy at home.","When I moved to a new city, I expected to feel lonely. Instead, I found that joining a local running club was the quickest way to make friends."];
const IR="In 1995, wolves were reintroduced to Yellowstone National Park after being absent for nearly seventy years. Almost immediately, the elk population, which had grown large without predators, began to change its behaviour. Elk avoided open valleys where they were easy targets, giving young trees along the rivers a chance to recover. As willows and aspens returned, beavers moved in and built dams, creating ponds that attracted fish, birds and otters. Even the rivers began to shift course as stronger roots held the banks in place. Scientists still debate how large the wolves’ role was compared with other factors such as climate, but most agree that removing a top predator had far-reaching consequences.";
const IRq=[{q:"Complete the sentence: “Elk avoided open valleys where they were easy ____.”",o:["targets","guides","trophies","shelters"]},{q:"Why did the elk change their behaviour?",o:["They became easy prey in open areas.","Food ran out in the valleys.","The park closed the valleys.","Beavers drove them away."]},{q:"What is the main idea of the passage?",o:["Bringing back a predator triggered wide changes in an ecosystem.","Beavers are the most important animals in Yellowstone.","Wolves were removed because they harmed elk.","Rivers in the park have dried up."]},{q:"Choose the best title.",o:["How Wolves Reshaped Yellowstone","A Guide to Beaver Dams","Why Elk Must Be Protected","Seventy Years Without Rain"]},{q:"What do scientists still disagree about?",o:["How much of the change the wolves caused","Whether wolves were reintroduced","Whether beavers build dams","When the park was founded"]}];
const DL=[[0,"Hi Tom, did you manage to book the room for Friday’s project meeting?"],[1,"I tried, but the library room is already taken until five. The only free one is in the science building."],[0,"That’s a bit far. Some of us have a lecture ending at four-thirty on the other side of campus."],[1,"True. We could start at five-thirty instead, or meet online."],[0,"Let’s meet online. Could you send everyone the link tonight?"]];
const WS=["Do you think people today rely too much on technology? Discuss, giving reasons and examples.","Is it better to live in a big city or in a small town? Explain your opinion with reasons and examples."];
const RTS=["Describe a skill you would like to learn and explain why it matters to you.","Talk about a person who has influenced you and describe how they changed your way of thinking."];
const ISQ=["Tell me about a place in your town where you like to spend time.","If you could change one thing about that place, what would it be, and why?","Do you think young people spend enough time outdoors? Why or why not?"];
/* ---------- tasks ---------- */
const SPd=r=>r;
const tasks=[
{s:'R',n:'Read and Select',lv:'B1–C1 (adaptive)',t:'90 s',d:'Select every <b>real English word</b>. Invented words are penalised. The second screen gets harder or easier depending on your first.',run(c,fin){let r=0,sc=[],mist=[],out=0,L=2,lv=[2];
const scr=()=>{const ws_=sh([...sh(W[L][0]).slice(0,5).map(w=>[w,1]),...sh(W[L][1]).slice(0,5).map(w=>[w,0])]);
c.innerHTML=`<p>Tap the <b>real English words</b>.</p><div class="grid">${ws_.map(([w])=>`<button class="chip">${w}</button>`).join('')}</div><button class="b" id="ok">Next</button>`;
c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
$('#ok').onclick=()=>{let hit=0,fp=0;ws_.forEach(([w,real],k)=>{const on=c.querySelectorAll('.chip')[k].classList.contains('on');if(real&&on)hit++;else if(real)mist.push(`Missed real word: ${w}`);else if(on){fp++;mist.push(`“${w}” is not an English word`)}});
const p=Math.max(0,(hit-fp)/5);sc.push(p*(.75+.1*L));if(r++==0&&!out){L=p>=.75?3:p>=.4?2:1;lv.push(L);scr()}else fin({pts:sc.reduce((a,b)=>a+b)/sc.length,mist})}};
scr();timer(90,()=>{out=1;$('#ok').click()})}},
{s:'L',n:'Listen and Type',lv:'B1–C1',t:'60 s per sentence',d:'Listen to a sentence (up to 3 plays) and type <b>exactly</b> what you hear. Spelling counts.',run(c,fin){const S=LT.map(pick);let k=0,sc=[],mist=[];
const show=()=>{let pl=3;c.innerHTML=`<p>Sentence ${k+1}/${S.length}</p><button class="b" id="pl">🔊 Play (<span id="pc">3</span> left)</button><textarea id="tx" rows="2" placeholder="Type what you hear"></textarea>${TTS?'':'<p class="m">No audio support in this browser. Practice mode: <button class="b" id="shw">Show text</button></p>'}<button class="b" id="ok">Next</button>`;
$('#pl').onclick=()=>{if(pl>0){pl--;$('#pc').textContent=pl;speechSynthesis.cancel();say(S[k])}};if($('#shw'))$('#shw').onclick=e=>e.target.parentNode.innerHTML=`<i>${S[k]}</i>`;
const nx=()=>{const t=$('#tx').value,a=lcs(S[k],t);sc.push(a);if(a<1)mist.push(`You typed “${t||'—'}” → correct: “${S[k]}”`);k++;k<S.length?show():fin({pts:sc.reduce((a,b)=>a+b)/S.length,mist})};$('#ok').onclick=nx;timer(60,nx);if(TTS)setTimeout(()=>$('#pl').click(),300)};show()}},
{s:'R',n:'Fill in the Blanks',lv:'B1–B2',t:'2 min 30 s',d:'Complete each word by typing the missing letters.',run(c,fin){gaps(c,sh(FB).slice(0,4).join('<br><br>'),150,fin)}},
{s:'R',n:'Read and Complete',lv:'B2',t:'3 min',d:'Complete the passage. Each word has missing letters at the end.',run(c,fin){gaps(c,pick(RC),180,fin)}},
{s:'S',n:'Read Aloud',lv:'B1–B2',t:'30 s',d:'Read the text aloud clearly. Press Start, read, then Stop.',run(c,fin){const t=pick(RA);speak(c,{html:`<div class="pass">${t}</div>`,secs:30},(tx,cf,d)=>{const a=tx?lcs(t,tx):0;fin({pts:a,mist:a<.9?[`Reading accuracy ${Math.round(a*100)}%. Transcript: “${tx||'—'}”`]:[],ex:{spoken:1,conf:cf,wpm:tx?nw(tx).length/d*60:null,n:nw(tx).length,errs:[],long:0,conn:0}})})}},
{s:'W',n:'Write About the Photo',lv:'B1–B2',t:'3 min',d:'Describe the picture in detail: who, what, where.',run(c,fin){write(c,`<div class="photo">${PH[0]}</div>${PHn}`,180,40,t=>{const r=ws(t,40);fin({pts:r.pts,mist:r.errs,ex:r})})}},
